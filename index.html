<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Public Support – Shri Harinarayan Chauhan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      overflow: hidden;
      text-align: center;
    }

    .header {
      background: linear-gradient(90deg, #007a3d, #f37021);
      color: #fff;
      padding: 18px;
    }

    .header img {
      width: 65px;
      margin-bottom: 8px;
    }

    .header h1 { font-size: 22px; margin: 6px 0; }
    .header h3 { font-size: 15px; margin: 0; font-weight: 500; }

    .photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #e5e7eb;
      margin: 20px auto 10px;
      display: block;
    }

    p {
      padding: 0 24px;
      color: #666;
      line-height: 1.6;
      text-align: justify;
    }

    .form-box {
      margin: 25px 24px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      text-align: left;
    }

    .form-box h3 {
      text-align: center;
      margin-bottom: 16px;
      color: #333;
    }

    .form-box label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }

    .form-box input,
    .form-box textarea,
    .form-box select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      background: #fff;
    }

    .form-box button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      font-size: 16px;
      background: #007a3d;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    footer {
      margin: 20px 0;
      font-size: 14px;
      color: #999;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <img src="aap-logo.png" alt="AAP Logo">
    <h1>श्री हरिनारायण चौहान</h1>
    <h3>जिला अध्यक्ष – आम आदमी पार्टी, देवरिया</h3>
    <h3>(जनसमर्थन एवं जनसंपर्क)</h3>
  </div>

  <!-- PHOTO -->
  <img src="harinarayan.jpg" class="photo" alt="Profile Photo">

  <p>
    यह मंच जनसमर्थन एवं समुदाय सेवा को समर्पित है।
    आम आदमी पार्टी से जुड़ने हेतु नीचे दिया गया फॉर्म भरें।
  </p>

  <!-- JOIN FORM -->
  <div class="form-box">
    <h3>आम आदमी पार्टी से जुड़ने के लिए फॉर्म</h3>

    <form onsubmit="sendEmail(); return false;">
      <label>पूरा नाम</label>
      <input type="text" id="name" required>

      <label>पिता का नाम</label>
      <input type="text" id="father" required>

      <label>आधार नंबर</label>
      <input type="text" id="aadhar" maxlength="12" pattern="[0-9]{12}" required>

      <label>मोबाइल नंबर</label>
      <input type="tel" id="mobile" required>

      <label>पूरा पता</label>
      <textarea id="address" rows="3"></textarea>

      <!-- DROPDOWN OPTIONS -->
      <label>आप कैसे जुड़ना चाहते हैं?</label>
      <select id="interest" required>
        <option value="">— विकल्प चुनें —</option>
        <option value="सदस्य">सदस्य</option>
        <option value="वालंटियर">वालंटियर</option>
        <option value="सोशल मीडिया सहयोग">सोशल मीडिया सहयोग</option>
        <option value="जनसेवा कार्य">जनसेवा कार्य</option>
      </select>

      <button type="submit">Email भेजें</button>
    </form>
  </div>

  <footer>
    © 2026 | जनसमर्थन एवं जनकल्याण
  </footer>
</div>

<script>
function sendEmail() {
  var subject = "AAP Join Form – New Submission";
  var body =
    "नाम: " + name.value + "%0D%0A" +
    "पिता का नाम: " + father.value + "%0D%0A" +
    "आधार नंबर: " + aadhar.value + "%0D%0A" +
    "मोबाइल: " + mobile.value + "%0D%0A" +
    "पता: " + address.value + "%0D%0A" +
    "जुड़ने का तरीका: " + interest.value;

  window.location.href =
    "mailto:chauhankrishna1996@gmail.com" +
    "?subject=" + encodeURIComponent(subject) +
    "&body=" + body;
}
</script>

</body>
</html>
