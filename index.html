<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Public Support – Shri Harinarayan Chauhan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      overflow: hidden;
      text-align: center;
    }
    .header {
      background: linear-gradient(90deg, #007a3d, #f37021);
      color: #fff;
      padding: 18px;
    }
    .header h1 { font-size: 22px; margin: 6px 0; }
    .header h3 { font-size: 15px; margin: 0; font-weight: 500; }

    .form-box {
      margin: 25px 24px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      text-align: left;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      font-size: 16px;
      background: #007a3d;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    footer {
      margin: 20px 0;
      font-size: 14px;
      color: #777;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>श्री हरिनारायण चौहान</h1>
    <h3>जिला अध्यक्ष – आम आदमी पार्टी, देवरिया</h3>
    <h3>(जनसमर्थन एवं जनसंपर्क)</h3>
  </div>

  <div class="form-box">
    <h3 style="text-align:center">आम आदमी पार्टी से जुड़ने हेतु फॉर्म</h3>

    <form action="https://formsubmit.co/chauhanharinarayan84@gmail.com"
          method="POST"
          onsubmit="saveData()">

      <!-- FormSubmit Settings -->
      <input type="hidden" name="_subject" value="AAP Join Form – New Submission">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <!-- ✅ CHANGE TO YOUR REAL URL -->
      <input type="hidden" name="_next"
        value="https://YOUR_USERNAME.github.io/YOUR_REPO/thankyou.html">

      <label>पूरा नाम</label>
      <input type="text" name="पूरा नाम" required>

      <label>पिता का नाम</label>
      <input type="text" name="पिता का नाम" required>

      <label>मोबाइल नंबर</label>
      <input type="tel" name="मोबाइल नंबर" pattern="[0-9]{10}" required>

      <label>आप कैसे जुड़ना चाहते हैं?</label>
      <select name="सहयोग प्रकार" required>
        <option value="">— विकल्प चुनें —</option>
        <option>सदस्य</option>
        <option>वालंटियर</option>
        <option>सोशल मीडिया सहयोग</option>
        <option>जनसेवा कार्य</option>
      </select>

      <button type="submit">फॉर्म सबमिट करें</button>
    </form>
  </div>

  <footer>
    © 2026 | जनसमर्थन एवं जनकल्याण
  </footer>

</div>

<script>
function saveData() {
  localStorage.setItem("name",
    document.querySelector('[name="पूरा नाम"]').value);
  localStorage.setItem("mobile",
    document.querySelector('[name="मोबाइल नंबर"]').value);
  localStorage.setItem("role",
    document.querySelector('[name="सहयोग प्रकार"]').value);
}
</script>

</body>
</html>
