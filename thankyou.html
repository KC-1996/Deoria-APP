<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>प्रमाणपत्र जारी</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  text-align: center;
  padding: 20px;
}

.certificate {
  max-width: 720px;
  margin: auto;
  padding: 35px;
  border: 8px solid #0f5132;
  background: #ffffff;
}

h1 { color: #0f5132; }
.name {
  font-size: 28px;
  font-weight: bold;
  color: #9a3412;
  margin: 20px 0;
}

.btn {
  margin-top: 20px;
  padding: 14px 28px;
  font-size: 16px;
  background: #25D366;
  color: #fff;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="cert" class="certificate">
  <h1>सदस्यता प्रमाणपत्र</h1>
  <p>यह प्रमाणित किया जाता है कि</p>

  <div class="name" id="name"></div>

  <p id="role"></p>

  <p>
    आम आदमी पार्टी, देवरिया<br><br>
    <strong>श्री हरिनारायण चौहान</strong><br>
    जिला अध्यक्ष – आम आदमी पार्टी
  </p>

  <p>दिनांक: <span id="date"></span></p>
</div>

<button class="btn" onclick="sendWhatsApp()">WhatsApp पर प्रमाणपत्र भेजें</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const name = localStorage.getItem("name");
const role = localStorage.getItem("role");
const mobile = localStorage.getItem("mobile");

document.getElementById("name").innerText = name;
document.getElementById("role").innerText =
  "आप आम आदमी पार्टी से " + role + " के रूप में जुड़े हैं।";

document.getElementById("date").innerText =
  new Date().toLocaleDateString("hi-IN");

// AUTO DOWNLOAD CERTIFICATE
html2canvas(document.getElementById("cert")).then(canvas => {
  const link = document.createElement("a");
  link.download = "AAP-Certificate.png";
  link.href = canvas.toDataURL();
  link.click();
});

// WhatsApp AUTO-OPEN WITH MESSAGE
function sendWhatsApp() {

  const message =
`नमस्ते ${name},

आम आदमी पार्टी, देवरिया से जुड़ने हेतु धन्यवाद।

✅ आपका सदस्यता प्रमाणपत्र जारी कर दिया गया है।

📌 भूमिका: ${role}

नोट: प्रमाणपत्र सत्यापन के बाद मान्य माना जाएगा।

– कार्यालय, आम आदमी पार्टी देवरिया`;

  const url =
    "https://wa.me/91" + mobile + "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}
</script>

</body>
</html>
``
